<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>
	<title>Registro - Caxambu</title>
	<link rel="stylesheet" href="/css/styles.css" />
	<link rel="stylesheet" href="/css/login.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
	<header>

			<div class="container-navbar">
				<nav class="navbar container">
					<i class="fa-solid fa-bars"></i>
					<div class="container-logo">
						<img src="/img/Caligrafia-caxambu.png" alt="Caligrafia-caxambu" />
					</div>
					<ul class="menu">
						<li><a href="index.html">Inicio</a></li>
					    <li><a href="cliente.html">Tienda</a></li>
					    <li><a href="login.html">Mi Cuenta</a></li>
                        <li><a href="soporte.html">Soporte</a></li>
					</ul>
					
				</nav>
			</div>
		</header>

	<main class="main-content login-page">
    <div class="container-login">
        <h2>Registro</h2>
        <form id="loginForm"> 
            
            <div id="errorMessage" class="error-message" style="display: none;">
                </div>

        
            <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" required placeholder="ej: Juan Carlos Perez Lopez">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ej: juan@gmail.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="ej: 123">
            </div>
            <div class="form-group">
                <label for="password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" required placeholder="ej: 123">
            </div>

            <div class="form-options">
                <a href=""></a>
            </div>

            <button type="submit" class="btn-submit">
                Registrarse
            </button>
        </form>
        <p class="register-link">
            ¿Ya tienes cuenta? <a href="login.html">Entrar</a>
        </p>
    </div>
</main>
    <script src="/js/script.js"></script> 
    <script src="/js/login.js"></script> 

</body>
</html>
